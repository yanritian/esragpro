version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: esragpro-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - esragpro-internal

  postgres:
    image: postgres:15
    container_name: esragpro-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=esragpro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - esragpro-internal

  redis:
    image: redis:7-alpine
    container_name: esragpro-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - esragpro-internal

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: esragpro-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - esragpro-internal

  neo4j:
    image: neo4j:5.15-community
    container_name: esragpro-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-esragpro123}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u \"$${NEO4J_AUTH%%/*}\" -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - esragpro-internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: esragpro-backend
    restart: unless-stopped
    # ⚠️ 安全：仅绑定回环地址。宿主机上的 MCP 网关与对话采集器通过
    # http://127.0.0.1:8000 访问，不对局域网暴露
    ports:
      - "127.0.0.1:8000:8000"
    expose:
      - "8000"
    environment:
      - ES_HOST=http://elasticsearch:9200
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-ollama}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-bge-m3}
      - EMBEDDING_OLLAMA_URL=${EMBEDDING_OLLAMA_URL:-http://host.docker.internal:11434}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-1024}
      - UVICORN_WORKERS=${UVICORN_WORKERS:-1}
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/esragpro
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-esragpro123}
      - WORLD_MEMORY_CANDIDATE_SOURCES_ENABLED=${WORLD_MEMORY_CANDIDATE_SOURCES_ENABLED:-false}
      - WORLD_MEMORY_ELASTICSEARCH_INDEX_NAME=${WORLD_MEMORY_ELASTICSEARCH_INDEX_NAME:-world-memory-history-v1}
      - WORLD_MEMORY_NEO4J_DATABASE=${WORLD_MEMORY_NEO4J_DATABASE:-neo4j}
      - WORLD_MEMORY_CANDIDATE_SOURCE_TIMEOUT_S=${WORLD_MEMORY_CANDIDATE_SOURCE_TIMEOUT_S:-2.0}
      - WORLD_MEMORY_EVENT_HISTORY_ENABLED=${WORLD_MEMORY_EVENT_HISTORY_ENABLED:-false}
      - WORLD_MEMORY_EVENT_HISTORY_INDEX_NAME=${WORLD_MEMORY_EVENT_HISTORY_INDEX_NAME:-world-memory-events-v2}
      - LLM_PROVIDER=${LLM_PROVIDER:-zhipu}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_started
      redis:
        condition: service_started
      neo4j:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    networks:
      - esragpro-internal
      - esragpro-frontend

  minio-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: esragpro-minio-worker
    command:
      - python
      - -m
      - app.memory_core.minio_worker_entrypoint
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/esragpro
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-memory-evidence}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_WORKER_IDENTITY: ${MINIO_WORKER_IDENTITY:-minio-worker-1}
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - esragpro-internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: esragpro-frontend
    restart: unless-stopped
    # 🌐 唯一对外暴露的端口
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - esragpro-frontend

volumes:
  es_data:
  postgres_data:
  redis_data:
  minio_data:
  neo4j_data:
  neo4j_logs:

networks:
  esragpro-internal:
    # 开发模式：移除 internal 以允许端口映射
  esragpro-frontend:
    # 前端网络，nginx 可以访问 backend
