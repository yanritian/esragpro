[project]
name = "esragpro"
version = "0.1.0"
description = "Enterprise Trusted Knowledge Base Solution with ES Hybrid Search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "elasticsearch[async]>=8.12.0,<9",
    "python-multipart>=0.0.6",
    "python-docx>=1.1.0",
    "PyMuPDF>=1.23.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13,<2",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "aiofiles>=23.2.0",
    "httpx>=0.26.0",
    "tiktoken>=0.5.0",
    "neo4j>=5.15.0",
    "minio>=7.2.0",
]

[project.optional-dependencies]
# Local in-process embedding (torch + sentence-transformers). Heavy (~1GB+):
# only needed when EMBEDDING_PROVIDER=local. Remote providers (qwen_api /
# zhipu_api) do not require this extra and keep the image small.
local-embedding = [
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "black>=24.1.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
