services:
  postgres:
    image: postgres:15
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: esragpro_p1_01_test
    ports:
      - target: 5432
        published: "0"
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d esragpro_p1_01_test"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    volumes:
      - p1_01_migration_test_data:/var/lib/postgresql/data

volumes:
  p1_01_migration_test_data:
