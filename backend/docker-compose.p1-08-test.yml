services:
  postgres:
    image: postgres:16
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: esragpro_p1_08_test
    ports:
      - target: 5432
        published: "${P1_08_POSTGRES_PORT}"
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d esragpro_p1_08_test"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    volumes:
      - p1_08_test_data:/var/lib/postgresql/data

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: "no"
    environment:
      MINIO_ROOT_USER: "${P1_08_MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${P1_08_MINIO_SECRET_KEY:-minioadmin}"
    command: server /data --console-address ":9001"
    ports:
      - target: 9000
        published: "${P1_08_MINIO_API_PORT}"
        host_ip: 127.0.0.1
        protocol: tcp
      - target: 9001
        published: "${P1_08_MINIO_CONSOLE_PORT}"
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    volumes:
      - p1_08_test_minio_data:/data

volumes:
  p1_08_test_data:
  p1_08_test_minio_data:
