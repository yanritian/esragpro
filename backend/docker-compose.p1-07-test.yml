services:
  postgres:
    image: postgres:16
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: esragpro_p1_07_test
    ports:
      - target: 5432
        published: "${P1_07_POSTGRES_PORT}"
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d esragpro_p1_07_test"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    volumes:
      - p1_07_test_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5.15-community
    restart: "no"
    environment:
      - NEO4J_AUTH=neo4j/${P1_07_NEO4J_PASSWORD:-esragpro_p1_07_test}
      - NEO4J_dbms_memory_heap_initial__size=256m
      - NEO4J_dbms_memory_heap_max__size=512m
      - NEO4J_dbms_security_auth__enabled=false
    ports:
      - target: 7474
        published: "${P1_07_NEO4J_HTTP_PORT}"
        host_ip: 127.0.0.1
        protocol: tcp
      - target: 7687
        published: "${P1_07_NEO4J_BOLT_PORT}"
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test:
        - "CMD-SHELL"
        - "if command -v curl >/dev/null 2>&1; then curl -sf http://localhost:7474 || exit 1; elif command -v wget >/dev/null 2>&1; then wget -qO- http://localhost:7474 || exit 1; elif command -v python3 >/dev/null 2>&1; then python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:7474', timeout=5)\" || exit 1; else exit 1; fi"
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 120s
    volumes:
      - p1_07_test_neo4j_data:/data
      - p1_07_test_neo4j_logs:/logs

volumes:
  p1_07_test_data:
  p1_07_test_neo4j_data:
  p1_07_test_neo4j_logs:
