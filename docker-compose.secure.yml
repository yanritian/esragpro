# 安全升级版 Docker Compose
# 包含：HTTPS、IP白名单、基础认证、速率限制

version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: esragpro-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true  # 🔐 启用 ES 认证
      - xpack.security.enrollment.enabled=false
      - ELASTIC_PASSWORD=${ES_PASSWORD:?ES_PASSWORD must be set}  # 设置 elastic 用户密码
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    expose:
      - "9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$${ELASTIC_PASSWORD} 'http://localhost:9200/_cluster/health?wait_for_status=yellow' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - esragpro-internal
    restart: unless-stopped
    # 🔐 安全：以非 root 用户运行
    user: "1000:1000"

  postgres:
    image: postgres:15
    container_name: esragpro-postgres
    environment:
      - POSTGRES_USER=${DB_USER:-esragpro}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?数据库密码未设置}
      - POSTGRES_DB=esragpro
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - esragpro-internal
    restart: unless-stopped
    # 🔐 安全：限制连接数
    command: postgres -c max_connections=50

  redis:
    image: redis:7-alpine
    container_name: esragpro-redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - esragpro-internal
    # 🔐 安全：启用密码保护
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    restart: unless-stopped

  neo4j:
    image: neo4j:5.15-community
    container_name: esragpro-neo4j
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
    expose:
      - "7474"
      - "7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u \"$${NEO4J_AUTH%%/*}\" -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - esragpro-internal
    restart: unless-stopped

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: esragpro-minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
    command: server /data --console-address ":9001"
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - esragpro-internal
    restart: unless-stopped

  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: esragpro-migration
    command:
      - alembic
      - upgrade
      - head
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-esragpro}:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/esragpro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - esragpro-internal
    restart: "no"

  embedding-model-init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: esragpro-embedding-model-init
    entrypoint:
      - python
      - /app/scripts/provision_embedding_model.py
    command:
      - verify
      - --lock
      - /app/model-locks/BAAI--bge-m3.json
      - --model-root
      - /models
    volumes:
      - embedding_model:/models
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: esragpro-backend
    expose:
      - "8000"
    environment:
      - ES_HOST=http://elasticsearch:9200
      - ES_USER=elastic
      - ES_PASSWORD=${ES_PASSWORD:?ES_PASSWORD must be set}
      - EMBEDDING_PROVIDER=local
      - EMBEDDING_MODEL=BAAI/bge-m3
      - EMBEDDING_MODEL_REVISION=5617a9f61b028005a4858fdac845db406aefb181
      - EMBEDDING_MODEL_PATH=/opt/esragpro/models/BAAI--bge-m3/5617a9f61b028005a4858fdac845db406aefb181
      - EMBEDDING_DIMENSION=1024
      - EMBEDDING_LOCAL_FILES_ONLY=true
      - EMBEDDING_OFFLINE=true
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - UVICORN_WORKERS=1
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-esragpro}:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/esragpro
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
      - NEO4J_ENABLED=${NEO4J_ENABLED:-true}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
      - MINIO_BUCKET=${MINIO_BUCKET_NAME:-memory-evidence}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-memory-evidence}
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - WORLD_MEMORY_CANDIDATE_SOURCES_ENABLED=${WORLD_MEMORY_CANDIDATE_SOURCES_ENABLED:-false}
      - WORLD_MEMORY_ELASTICSEARCH_INDEX_NAME=${WORLD_MEMORY_ELASTICSEARCH_INDEX_NAME:-world-memory-history-v1}
      - WORLD_MEMORY_NEO4J_DATABASE=${WORLD_MEMORY_NEO4J_DATABASE:-neo4j}
      - WORLD_MEMORY_CANDIDATE_SOURCE_TIMEOUT_S=${WORLD_MEMORY_CANDIDATE_SOURCE_TIMEOUT_S:-2.0}
      - WORLD_MEMORY_EVENT_HISTORY_ENABLED=${WORLD_MEMORY_EVENT_HISTORY_ENABLED:-false}
      - WORLD_MEMORY_EVENT_HISTORY_INDEX_NAME=${WORLD_MEMORY_EVENT_HISTORY_INDEX_NAME:-world-memory-events-v2}
      - LLM_PROVIDER=${LLM_PROVIDER:-zhipu}
      - LLM_API_KEY=${LLM_API_KEY:?LLM API密钥未设置}
      - LLM_MODEL=${LLM_MODEL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT密钥未设置}
      - DEBUG=false
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
      embedding-model-init:
        condition: service_completed_successfully
      migration:
        condition: service_completed_successfully
    volumes:
      - uploads_data:/app/uploads
      - embedding_model:/opt/esragpro/models:ro
    networks:
      - esragpro-internal
      - esragpro-frontend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s
    restart: unless-stopped
    # 🔐 安全：只读文件系统（除了必要的目录）
    read_only: true
    tmpfs:
      - /tmp
    # 🔐 安全：资源限制
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 3G

  minio-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: esragpro-minio-worker
    command:
      - python
      - -m
      - app.memory_core.minio_worker_entrypoint
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-esragpro}:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/esragpro
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-memory-evidence}
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - MINIO_WORKER_IDENTITY=${MINIO_WORKER_IDENTITY:-minio-worker-1}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - esragpro-internal
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NGINX_CONFIG: nginx-secure.conf
    container_name: esragpro-frontend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # HTTPS 证书挂载
      - ./certs:/etc/nginx/certs:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
      - ./certbot_www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - esragpro-frontend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O - https://localhost/health | grep -q healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  es_data:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  minio_data:
  embedding_model:
  uploads_data:

networks:
  esragpro-internal:
    internal: true
  esragpro-frontend:
