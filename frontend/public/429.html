<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>请求过于频繁</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        h1 {
            font-size: 72px;
            margin: 0;
            opacity: 0.9;
        }
        h2 {
            font-size: 24px;
            margin: 20px 0;
            opacity: 0.95;
        }
        p {
            font-size: 16px;
            opacity: 0.8;
            margin: 10px 0;
        }
        .retry {
            margin-top: 30px;
            padding: 12px 30px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .retry:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>429</h1>
        <h2>请求过于频繁</h2>
        <p>您访问的速度太快了，请稍后再试</p>
        <p id="timer">等待 <span id="seconds">5</span> 秒后重试</p>
        <button class="retry" onclick="location.reload()">立即重试</button>
    </div>
    <script>
        let seconds = 5;
        const timer = setInterval(() => {
            seconds--;
            document.getElementById('seconds').textContent = seconds;
            if (seconds <= 0) {
                clearInterval(timer);
                location.reload();
            }
        }, 1000);
    </script>
</body>
</html>
