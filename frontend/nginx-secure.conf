# ============================================
# esRAGPro 安全版 Nginx 配置
# 包含：HTTPS、IP白名单、基础认证、速率限制
# ============================================

# 速率限制区域
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# 上游服务器
upstream backend {
    server backend:8000;
    keepalive 32;
}

# HTTP 重定向到 HTTPS
server {
    listen 80;
    server_name _;

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;

    # Let's Encrypt 验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主服务器
server {
    listen 443 ssl http2;
    server_name _;
    root /usr/share/nginx/html;

    # ==================== SSL/TLS 配置 ====================

    # 证书路径（Let's Encrypt 或自签名）
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (浏览器强制 HTTPS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ==================== 安全头 ====================

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;" always;

    # 隐藏版本号
    server_tokens off;

    # 请求限制
    client_max_body_size 50m;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # 超时设置
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 300s;
    keepalive_timeout 65;

    # ==================== IP 白名单 (可选) ====================
    # 取消注释以启用 IP 白名单
    # allow 1.2.3.4;      # 允许的 IP
    # allow 10.0.0.0/8;   # 允许的内网
    # deny all;           # 拒绝其他所有

    # ==================== API 反向代理 ====================

    # 健康检查（无需认证）
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 登录接口 - 更严格的限制
    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=login burst=5 nodelay;
        limit_conn conn_limit 5;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 管理接口 - 需要基础认证（双因素认证）
    location ~ ^/api/v1/(admin|users) {
        # 基础认证（第一层保护）
        auth_basic "Admin Area";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # 速率限制
        limit_req zone=api burst=10 nodelay;
        limit_conn conn_limit 5;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 文件上传接口
    location ~ ^/api/v1/kb/upload {
        limit_req zone=upload burst=3 nodelay;
        limit_conn conn_limit 3;
        client_max_body_size 50m;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 普通API接口
    location /api {
        limit_req zone=api burst=30 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==================== 安全规则 ====================

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        return 404;
    }

    # 禁止访问敏感文件
    location ~* \.(env|git|gitignore|dockerignore|md|yml|yaml|toml|ini|conf)$ {
        deny all;
        return 404;
    }

    # 禁止访问备份文件
    location ~* \.(bak|backup|old|orig|original|save|swp|tmp)$ {
        deny all;
        return 404;
    }

    # 禁止直接访问数据库/缓存
    location ~ ^/(9200|5432|6379) {
        return 444;  # 直接断开连接
    }

    # ==================== 前端静态文件 ====================

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level 6;

    # ==================== 错误页面 ====================

    error_page 429 /429.html;
    error_page 500 502 503 504 /50x.html;

    location = /429.html {
        root /usr/share/nginx/html;
        internal;
    }

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
